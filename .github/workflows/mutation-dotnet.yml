# Weekly mutation testing with Stryker.NET, from MafLabs38/github-template (quality option "mutation").
# It measures whether the tests catch injected bugs; it never blocks a PR.
# Each test project listed in the matrix needs a stryker-config.json (template next to this file).
name: Mutation testing (.NET)

on:
  schedule:
    - cron: "23 3 * * 6" # Saturday night
  workflow_dispatch:
  # Validate a change of the Stryker configuration itself.
  pull_request:
    paths:
      - ".github/workflows/mutation-dotnet.yml"
      - "**/stryker-config.json"

permissions:
  contents: read

concurrency:
  group: mutation-dotnet-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  stryker:
    name: mutation (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Unit test projects (folders under src/); integration tests are too slow to mutate.
        project: [MafLabs.Notifications.Test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Stryker.NET
        working-directory: src/${{ matrix.project }}
        run: dotnet stryker --reporter markdown --reporter html --reporter progress --output StrykerOutput
      - name: Summary
        if: always()
        run: cat src/${{ matrix.project }}/StrykerOutput/reports/mutation-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutation-${{ matrix.project }}
          path: src/${{ matrix.project }}/StrykerOutput/reports/

# Publishes MafLabs.Notifications to nuget.org when a version tag (v1.2.3) is pushed. No API key is stored: nuget.org trusts this
# workflow (a Trusted Publishing policy: owner MafLabs38, repository maflabs-notifications, file publish.yml) and gives it a short-lived key.
name: publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token that nuget.org exchanges for a short-lived API key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build MafLabs.Notifications.slnx --configuration Release -p:Version="$VERSION"
      - run: dotnet test --solution MafLabs.Notifications.slnx --configuration Release --no-build
      - run: dotnet pack src/MafLabs.Notifications --configuration Release --no-build -p:Version="$VERSION" --output ./nupkg
      - name: Short-lived NuGet key (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: maf38
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

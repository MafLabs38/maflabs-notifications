# Build, format and test on every push to main/develop and every pull request. Publishing is a separate workflow (publish.yml), on a version tag.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet format MafLabs.Notifications.slnx --verify-no-changes

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet build MafLabs.Notifications.slnx --configuration Release
      - run: >
          dotnet test --solution MafLabs.Notifications.slnx --configuration Release --no-build --
          --coverage --coverage-output-format xml --results-directory "$PWD/coverage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage/
      # The package must build: this is the artifact publish.yml pushes, here only checked.
      - run: dotnet pack src/MafLabs.Notifications --configuration Release --no-build -p:Version=0.0.0-ci --output ./nupkg

  sonarqube:
    name: sonarqube
    runs-on: ubuntu-latest
    needs: test
    # Skipped on a draft pull request and with the "skip-quality" label; runs once the SonarQube server is configured (repository variable + secret).
    if: vars.SONAR_HOST_URL != '' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'skip-quality')))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage
          path: coverage/
      # Pinned: this job holds the SonarQube token, so a new release must not run in it unreviewed.
      - run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0
      # The .NET scanner does not read SONAR_TOKEN for `begin`, so the token is an argument of `begin` and `end`. Pull requests from forks never get it.
      # tools/ holds the review-decisions checker copied from github-template: it has its own tests (test_check.py) and is not product code.
      # Roslyn/IDE analyzers are already enforced by the build and dotnet format: importing them into Sonar only duplicates them.
      - name: Begin SonarQube analysis
        run: >
          dotnet sonarscanner begin
          /k:"${{ github.repository_owner }}_${{ github.event.repository.name }}"
          /d:sonar.host.url="${{ vars.SONAR_HOST_URL }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage/**/*.xml"
          /d:sonar.coverage.exclusions="**/obj/**,**/*.g.cs"
          /d:sonar.cs.roslyn.ignoreIssues=true
          /d:sonar.exclusions="tools/**"
          /d:sonar.qualitygate.wait=true
      - run: dotnet build MafLabs.Notifications.slnx --configuration Release
      - name: End SonarQube analysis
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

# Build, format and test on every push to main/develop and every pull request. Publishing is a separate workflow (publish.yml), on a version tag.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet format MafLabs.Notifications.slnx --verify-no-changes

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - run: dotnet build MafLabs.Notifications.slnx --configuration Release
      - run: dotnet test --solution MafLabs.Notifications.slnx --configuration Release --no-build
      # The package must build: this is the artifact publish.yml pushes, here only checked.
      - run: dotnet pack src/MafLabs.Notifications --configuration Release --no-build -p:Version=0.0.0-ci --output ./nupkg
